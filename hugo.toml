baseURL = "https://roussev.dev"
locale = "en-us"
title = "Bogomil Roussev"
theme = "terminal"
enableRobotsTXT = true
# Analytics: GA4 is loaded by Cloudflare Zaraz (with its consent banner), not
# by Hugo. Keep googleAnalytics unset so the page never loads gtag.js.

[pagination]
  pagerSize = 5

[params]
  description = "AWS & Terraform automation consultant: read-only AWS cost audits with CostLens, cloud infrastructure, Terraform modules and CI/CD pipelines."
  author = "Bogomil Roussev"
  # Cloudflare Turnstile site key for the inquiry form (public value).
  # The matching secret is TURNSTILE_SECRET_KEY in the Pages project settings.
  turnstileSiteKey = "0x4AAAAAAGSpFYyPNtTvd7ji"
  # Public Google Calendar booking page for the free intro call. Linked only
  # from the inquiry page, as the "rather talk first?" option. The build fails
  # while it is empty.
  bookingURL = "https://calendar.app.google/PNGwrcqC15GjBFve9"
  subtitle = "Cloud & Platform Engineer, AWS Consultant"
  # Default og:image / twitter:image (1200x630) for pages without their own
  # `images` front matter. Its presence also switches twitter:card to
  # summary_large_image.
  images = ["images/og-default.png"]

  # dir name of your main content (default is `content/posts`).
  # the list of articles will be on this page
  contentTypeName = "posts"

  # ["orange", "blue", "red", "green", "pink"]
  # default is orange
  themeColor = "orange"

  # if you set this to 0, only submenu trigger will be visible
  showMenuItems = 5

  # show selector to switch language
  showLanguageSelector = false

  # set theme to full screen width
  fullWidthTheme = false

  # center theme with default width
  centerTheme = true

  # if your resource directory contains an image called `cover.(jpg|png|webp)`,
  # then the file will be used as a cover automatically.
  # default is false
  autoCover = true

  # set post to show the last updated
  # If you use git, you can set `enableGitInfo` to `true` and then post will automatically get the last updated
  showLastUpdated = false

# The site's one call to action (cta shortcode, article footer). Every
# button says the same thing and leads to the inquiry form.
[params.cta]
  label = "Discuss your project"
  href = "/order/"

# Social media links
[[params.social]]
  name = "email"
  url = "mailto:bogomil.roussev@gmail.com"

[[params.social]]
  name = "github"
  url = "https://github.com/bogsi"

[[params.social]]
  name = "linkedin"
  url = "https://linkedin.com/in/bogomilroussev"

[[params.social]]
  name = "medium"
  url = "https://medium.com/@bogomilroussev"

# Syntax highlighting
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = "monokai"

# Privacy settings
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true

[languages]
  [languages.en]
    label = "English"
    title = "Bogomil Roussev"
    subtitle = "Cloud & Platform Engineer, AWS Consultant"
    owner = "Bogomil Roussev"
    keywords = "AWS, Terraform, Cloud, Infrastructure, Automation, DevOps"
    copyright = ""
    menuMore = "Show more"
    readMore = "Read more"
    readOtherPosts = "Read other posts"
    newerPosts = "Newer posts"
    olderPosts = "Older posts"
    missingContentMessage = "Page not found..."
    missingBackButtonLabel = "Back to home page"

    [languages.en.params.logo]
      logoText = "Bogomil Roussev"
      logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
        weight = 1
      [[languages.en.menu.main]]
        identifier = "services"
        name = "Services"
        url = "/services"
        weight = 2
      [[languages.en.menu.main]]
        identifier = "projects"
        name = "Projects"
        url = "/projects"
        weight = 3
      [[languages.en.menu.main]]
        identifier = "blog"
        name = "Blog"
        url = "/posts"
        weight = 4
      [[languages.en.menu.main]]
        identifier = "order"
        name = "Inquiry"
        url = "/order"
        weight = 5

[build]
  writeStats = true

[server]
  enableCompression = true

[imaging]
  resampleFilter = "lanczos"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85

[outputs]
  home = ["HTML", "RSS", "LLMS"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
