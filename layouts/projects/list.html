{{ define "main" }}
<div class="post">
  {{ partial "page-header.html" . }}
  {{ with .Content }}
  <div class="post-content">{{ . }}</div>
  {{ end }}

  <ul class="card-list card-list--grid">
    {{ range .Pages.ByDate.Reverse }}
    <li>{{ partial "entry-card.html" (dict "page" . "level" 2) }}</li>
    {{ end }}
  </ul>
</div>
{{ end }}
