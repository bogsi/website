{{/* css/style.css is bundled once in head.html. */}}

<!-- Fira Code font -->
<link rel="preload" href="https://cdn.staticdelivr.com/gfonts/css2?family=Fira+Code:wght@300..700&display=swap" as="style">
<link rel="stylesheet" href="https://cdn.staticdelivr.com/gfonts/css2?family=Fira+Code:wght@300..700&display=swap">

<!-- JetBrains Mono font -->
<link rel="preload" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.min.css" as="style">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.min.css">

<!-- Order form styles -->
{{ if eq .Section "order" }}
  {{ with resources.Get "css/order.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{ end }}
{{ end }}

<!-- Custom styles -->
<style>
  :root {
    --accent: #ff8700;
    --background: #1a170f;
    --foreground: #eceae5;
    --radius: 0;
  }
</style>
