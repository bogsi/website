  <div class="copyright">
    <span><a href="{{ "privacy/" | relLangURL }}">Privacy</a></span>
    <span>::</span>
    <span><a href="#" id="cookie-settings" role="button">Cookie settings</a></span>
    <span>::</span>
    {{ if $.Site.Copyright }}
      {{ $.Site.Copyright }}
    {{ else }}
      <span>© {{ now.Year }} Powered by <a href="https://gohugo.io">Hugo</a></span>
      <span>::</span>
      <span>Theme made by <a href="https://github.com/panr">panr</a></span>
    {{ end }}
  </div> 

<script>
  // Zaraz consent (GA4 only after "Accept"). The link reopens the consent
  // modal; choices are mirrored to Google Consent Mode v2 for the GA4 tool.
  (function () {
    var link = document.getElementById("cookie-settings");
    if (link) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        if (window.zaraz && zaraz.showConsentModal) zaraz.showConsentModal();
      });
    }
    function syncGoogleConsent() {
      if (!window.zaraz || !zaraz.consent || !zaraz.set) return;
      var choices = zaraz.consent.getAll() || {};
      var analytics = Object.keys(choices).some(function (k) { return choices[k] === true; });
      zaraz.set("google_consent_update", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: analytics ? "granted" : "denied"
      });
    }
    document.addEventListener("zarazConsentAPIReady", syncGoogleConsent);
    document.addEventListener("zarazConsentChoicesUpdated", syncGoogleConsent);

    // Click events (sent only with analytics consent): inquiry buttons and
    // links to Medium. No personal data, only where the click happened.
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a || !window.zaraz || typeof zaraz.track !== "function") return;
      var url;
      try { url = new URL(a.href, location.href); } catch (_) { return; }
      if (url.origin === location.origin && url.pathname.indexOf("/order") === 0 && location.pathname.indexOf("/order") !== 0) {
        zaraz.track("cta_click", { cta_id: a.getAttribute("data-cta-id") || location.pathname });
      } else if (url.hostname === "medium.com" || url.hostname.slice(-11) === ".medium.com") {
        var parts = url.pathname.split("/").filter(Boolean);
        zaraz.track("outbound_medium", { post_slug: parts.length > 1 ? parts[parts.length - 1] : "profile" });
      }
    });
  })();
</script>
