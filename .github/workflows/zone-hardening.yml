name: Zone hardening

# Manual: DNSSEC, edge TLS settings, the /api/order rate limit, WAF custom
# rules, the Search Console TXT record, and read-only Access and email DNS
# reports.
# Uses a short-lived CLOUDFLARE_ZONE_TOKEN secret; delete the token and the
# secret after a successful "apply" run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only report; apply = change what differs"
        type: choice
        options: [check, apply]
        default: check
      google_site_verification:
        description: 'Optional: the TXT value from Search Console ("google-site-verification=...")'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: zone-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: admin } }
    env:
      CLOUDFLARE_ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_SITE_VERIFICATION: ${{ inputs.google_site_verification }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the zone token
        run: |
          if [ -z "$CLOUDFLARE_ZONE_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_ZONE_TOKEN secret first (see the comment in scripts/zone-hardening.ts)."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node --experimental-strip-types scripts/zone-hardening.ts "${{ inputs.mode }}"
