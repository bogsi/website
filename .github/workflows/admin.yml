name: Admin dashboard

on:
  pull_request:
    paths: ["admin/**", "functions/**", "lib/**", ".github/workflows/admin.yml"]
  push:
    branches: [main]
    paths: ["admin/**", "lib/**", ".github/workflows/admin.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "check = read-only report (prints the GitHub OAuth callback URL); deploy = provision and deploy"
        type: choice
        options: [check, deploy]
        default: check

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      # Fails the PR on a known high or critical vulnerability in any dependency.
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  provision:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: admin } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_GITHUB_CLIENT_ID: ${{ secrets.ACCESS_GITHUB_CLIENT_ID }}
      ACCESS_GITHUB_CLIENT_SECRET: ${{ secrets.ACCESS_GITHUB_CLIENT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Repository variable or secret, whichever is set.
      ADMIN_ALLOWED_EMAILS: ${{ vars.ADMIN_ALLOWED_EMAILS || secrets.ADMIN_ALLOWED_EMAILS }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip until Cloudflare credentials exist
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Admin not provisioned: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (admin/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.ready == 'true'
        with: { node-version: 24, cache: npm, cache-dependency-path: admin/package-lock.json }
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true' && env.MODE == 'deploy'
        run: npm run build
      - if: steps.gate.outputs.ready == 'true'
        run: node --experimental-strip-types scripts/provision.ts "$MODE"
