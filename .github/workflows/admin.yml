name: Admin dashboard

on:
  pull_request:
    paths: ["admin/**", "functions/**", ".github/workflows/admin.yml"]
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/admin.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: admin } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - name: Check configuration
        run: |
          if grep -q 'REPLACE_' wrangler.jsonc; then
            echo "::error::admin/wrangler.jsonc still has REPLACE_ placeholders. See admin/README.md, Setup."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply roussev-orders --remote
      - run: npx wrangler deploy
