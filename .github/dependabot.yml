version: 2
updates:
  # GitHub Actions used by all workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # Hugo theme (themes/terminal git submodule)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Admin dashboard (Vite/React SPA + Hono Worker); one grouped PR a week,
  # security updates still arrive on their own as soon as they are published.
  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      admin-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is a rewritten compiler; migrate deliberately, not via a bot PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types must match the runtime (Node 24 in CI), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
